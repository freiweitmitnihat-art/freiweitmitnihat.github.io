<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Drehreise Kontaktbuch</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --bg:#EDF1EE; --paper:#FFFFFF; --paper2:#F5F8F6; --ink:#14201D; --ink2:#46554F; --ink3:#6E7C77; --line:#D4DDD9;
  --gold:#FFCC00; --gold-ink:#14201D; --gold-soft:#FFF4C2;
  --t-termin:#1C7443; --t-termin-bg:#DCEFE2; --t-antwort:#22599A; --t-antwort-bg:#E0EAF6;
  --t-wartet:#8A5A06; --t-wartet-bg:#FAEBC9; --t-offen:#5F6D68; --t-offen-bg:#E7ECEA;
  --focus:#22599A;
  --disp:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow","Helvetica Neue",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1412; --paper:#161E1C; --paper2:#1B2522; --ink:#E6EEEB; --ink2:#B2C0BB; --ink3:#859490; --line:#2A3633;
  --gold:#FFCC00; --gold-ink:#14201D; --gold-soft:#3A3212;
  --t-termin:#7FD3A0; --t-termin-bg:#16301F; --t-antwort:#9CC2F0; --t-antwort-bg:#182A42;
  --t-wartet:#F0C46C; --t-wartet-bg:#372A0F; --t-offen:#A9B6B2; --t-offen-bg:#232D2A; --focus:#9CC2F0;
}}
:root[data-theme="dark"]{
  --bg:#0E1412; --paper:#161E1C; --paper2:#1B2522; --ink:#E6EEEB; --ink2:#B2C0BB; --ink3:#859490; --line:#2A3633;
  --gold:#FFCC00; --gold-ink:#14201D; --gold-soft:#3A3212;
  --t-termin:#7FD3A0; --t-termin-bg:#16301F; --t-antwort:#9CC2F0; --t-antwort-bg:#182A42;
  --t-wartet:#F0C46C; --t-wartet-bg:#372A0F; --t-offen:#A9B6B2; --t-offen-bg:#232D2A; --focus:#9CC2F0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--body)}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 64px}

/* Kopf */
.top{background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font:700 26px/1 var(--disp);letter-spacing:.02em;text-transform:uppercase}
.brand small{font:400 12.5px/1.3 var(--mono);color:var(--ink3);margin-top:3px}
.btn-planer{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font:600 15px/1 var(--body)}
.orte{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.orte::-webkit-scrollbar{display:none}
.ort-chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:7px 11px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:92px}
.ort-chip b{font:700 18px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em}
.ort-chip span{font:400 12px/1 var(--mono);color:var(--ink3)}
.ort-chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ort-chip[aria-pressed="true"] span{color:inherit;opacity:.75}
.ort-chip .jetzt{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-left:5px;vertical-align:2px;box-shadow:0 0 0 2px var(--paper)}
.suche{margin-top:10px;position:relative}
.suche input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 14px;font-size:17px}
.suche input::placeholder{color:var(--ink3)}

/* Tage */
.tage{margin-top:20px}
.h2{font:700 15px/1 var(--disp);text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);margin:0 0 10px}
.tag-liste{display:grid;gap:10px}
.tag{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tag.heute{border-color:var(--gold);box-shadow:inset 4px 0 0 var(--gold)}
.tag-kopf{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.tag-kopf b{font:700 20px/1.1 var(--disp);text-transform:uppercase;letter-spacing:.02em}
.tag-kopf span{font:400 13px/1.2 var(--mono);color:var(--ink3)}
.tag ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.tag li{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:baseline}
.tag li .zeit{font:500 14px/1.3 var(--mono);color:var(--ink2)}
.tag li a{text-decoration:none;font-weight:600}
.tag li a:hover{text-decoration:underline}
.tag li em{font-style:normal;color:var(--ink3);font-size:14px}
.tag .leer{color:var(--ink3);font-size:15px;margin-top:6px}

/* Ort-Kopf */
.ort-kopf{margin-top:28px;display:flex;flex-direction:column;gap:4px}
.ort-kopf h1{margin:0;font:700 44px/.95 var(--disp);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.ort-kopf .dat{font:500 15px/1.3 var(--mono);color:var(--ink2)}
.ort-kopf .hin{color:var(--ink2);font-size:15.5px;max-width:62ch}
.zaehler{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 13px/1 var(--body);padding:5px 9px;border-radius:999px;white-space:nowrap}
.s-termin{color:var(--t-termin);background:var(--t-termin-bg)}
.s-antwort{color:var(--t-antwort);background:var(--t-antwort-bg)}
.s-wartet{color:var(--t-wartet);background:var(--t-wartet-bg)}
.s-offen,.s-ruht{color:var(--t-offen);background:var(--t-offen-bg)}

/* Gruppen */
.gruppe{margin-top:26px}
.gruppe-kopf{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.gruppe-kopf h2{margin:0;font:700 22px/1 var(--disp);text-transform:uppercase;letter-spacing:.03em}
.gruppe-kopf span{font:500 14px/1 var(--mono);color:var(--ink3)}
.gruppe-kopf p{margin:0 0 0 auto;font-size:13.5px;color:var(--ink3);text-align:right}
details.ruht-box > summary{cursor:pointer;list-style:none}
details.ruht-box > summary::-webkit-details-marker{display:none}
details.ruht-box > summary .gruppe-kopf h2::after{content:" +";color:var(--ink3)}
details.ruht-box[open] > summary .gruppe-kopf h2::after{content:" –"}

/* Person */
.person{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin-top:10px;display:grid;gap:9px}
.p-kopf{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.p-name{font:600 19.5px/1.2 var(--body);margin:0}
.p-art{font:500 12px/1 var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;display:block}
.p-termin{font:500 15px/1.3 var(--mono);color:var(--t-termin);background:var(--t-termin-bg);border-radius:8px;padding:6px 9px;justify-self:start}
.p-was{color:var(--ink2);font-size:15.5px;margin:0}
.p-kanal{font-size:15px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:8px 10px;background:var(--paper2);border-radius:10px}
.p-kanal b{font-weight:700}
.p-kanal span{font:400 13.5px/1.3 var(--mono);color:var(--ink3)}
.wege{display:grid;gap:0;border-top:1px solid var(--line)}
.weg{display:grid;grid-template-columns:88px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.weg .k{font:500 12.5px/1.2 var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.weg.haupt .k{color:var(--ink);font-weight:600}
.weg .v{font-size:16px;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.weg .v small{display:block;color:var(--ink3);font-size:13px}
.weg .akt{display:flex;gap:6px}
.mini{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 10px;font:600 13.5px/1 var(--body);cursor:pointer;text-decoration:none;white-space:nowrap}
.mini.ok{background:var(--t-termin-bg);color:var(--t-termin);border-color:transparent}
.p-wo{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.p-wo .ort-text{font-size:15px;color:var(--ink2);flex:1 1 200px}
.p-wo .ort-text i{font-style:normal;font:500 11.5px/1 var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px}
.maps{display:inline-flex;align-items:center;gap:7px;background:var(--gold);color:var(--gold-ink);text-decoration:none;font:700 15px/1 var(--body);padding:10px 14px;border-radius:10px;flex:none}
.maps svg{width:16px;height:16px}
details.mehr summary{cursor:pointer;font:600 14.5px/1.3 var(--body);color:var(--ink2)}
details.mehr p{margin:6px 0 0;font-size:15px;color:var(--ink2)}
details.mehr p b{color:var(--ink)}
.leer-gruppe{color:var(--ink3);font-size:15px;padding:10px 0}
.fuss{margin-top:40px;color:var(--ink3);font-size:14px;display:grid;gap:6px}
.fuss a{color:var(--ink2)}
.schloss{padding-block:18vh 40px;display:grid;gap:14px;max-width:420px}
.schloss-titel{font:700 34px/1 var(--disp);text-transform:uppercase}
.schloss p{margin:0;color:var(--ink2)}
.schloss form{display:grid;gap:10px}
.schloss label{font:600 15px/1.2 var(--body)}
.schloss input[type=password]{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:13px 14px;font-size:18px}
.schloss .merken{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink2)}
.schloss button{background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:14px;font:700 17px/1 var(--body);cursor:pointer}
#schloss-fehler{min-height:1.4em;color:var(--t-wartet);font-size:15px}
.treffer-ort{font:500 12px/1 var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
@media (max-width:420px){
  .weg{grid-template-columns:1fr auto;}
  .weg .k{grid-column:1 / -1;margin-bottom:-4px}
  .ort-kopf h1{font-size:38px}
  .gruppe-kopf p{display:none}
  .brand b{font-size:23px}
}
@media (prefers-reduced-motion:no-preference){ .mini,.ort-chip{transition:background .15s,color .15s} }
</style>

<div class="top" id="top">
  <div class="wrap" style="padding-bottom:0">
    <div class="top-row">
      <div class="brand"><b>Drehreise Kontaktbuch</b><small id="stand"></small></div>
      <a class="btn-planer" id="planer" href="#" target="_blank" rel="noopener">Routenplaner ↗</a>
    </div>
    <nav class="orte" id="orte" aria-label="Orte der Reise"></nav>
    <div class="suche"><label for="q" class="h2" style="position:absolute;left:-9999px">Suche</label><input id="q" type="search" placeholder="Name, Betrieb oder Stichwort suchen" autocomplete="off"></div>
  </div>
</div>

<section class="schloss wrap" id="schloss" hidden>
  <b class="schloss-titel">Drehreise Kontaktbuch</b>
  <p>Diese Seite ist verschlüsselt. Mit deinem Passwort öffnen.</p>
  <form id="schloss-form" autocomplete="on">
    <input type="text" name="username" value="kontaktbuch" autocomplete="username" hidden>
    <label for="pw">Passwort</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <label class="merken"><input id="merken" type="checkbox" checked> Auf diesem Handy merken</label>
    <button type="submit">Öffnen</button>
    <div id="schloss-fehler" role="status"></div>
  </form>
</section>
<main class="wrap">
  <section class="tage" id="tage"></section>
  <section id="ort"></section>
  <footer class="fuss" id="fuss"></footer>
</main>

const WT=['So','Mo','Di','Mi','Do','Fr','Sa'];
const STUFEN=[
  {id:'termin',titel:'Termin oder Zusage',erkl:'fester oder vorgeschlagener Tag'},
  {id:'antwort',titel:'Hat geantwortet',erkl:'noch kein Tag vereinbart'},
  {id:'wartet',titel:'Angeschrieben',erkl:'noch keine Antwort'},
  {id:'offen',titel:'Noch nicht angeschrieben',erkl:''},
];
const PILL={termin:'Termin',antwort:'Antwort',wartet:'Wartet',offen:'Offen',ruht:'Ruht'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const d=s=>{const [y,m,t]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,t))};
const fmt=s=>{if(!s)return'';const x=d(s);return WT[x.getUTCDay()]+' '+String(x.getUTCDate()).padStart(2,'0')+'.'+String(x.getUTCMonth()+1).padStart(2,'0')+'.'};
const kurz=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.':'';
const plus=(s,n)=>{const x=d(s);x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const heute=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'});
let START,ENDE;

function ortVonTag(t){return D.route.filter(r=>t>=r.von&&t<=r.bis)}
function stopFuer(id){return D.route.find(r=>r.id===id)}
function ortId(stop){return stop.id==='bangkok2'?'bangkok':stop.id}

let S={ort:null,q:''};
function start(){
START=D.route[0].von;ENDE=D.route[D.route.length-1].bis;
document.getElementById('top').hidden=false;document.getElementById('schloss').hidden=true;
try{const v=JSON.parse(localStorage.getItem('kb-ort')||'null');if(v)S.ort=v}catch(e){}
if(!S.ort){const jetzt=ortVonTag(heute<START?START:heute>ENDE?ENDE:heute);S.ort=(jetzt[jetzt.length-1]||D.route[0]).id}

document.getElementById('stand').textContent='Stand '+D.stand+' · Route 2';
document.getElementById('planer').href=D.planer;
render();
}

function renderOrte(){
  const jetzt=ortVonTag(heute).map(r=>r.id);
  const chips=D.route.map(r=>`<button class="ort-chip" data-ort="${r.id}" aria-pressed="${S.ort===r.id&&!S.q}"><b>${esc(r.name)}${jetzt.includes(r.id)?'<i class="jetzt" title="heute"></i>':''}</b><span>${r.von===r.bis?kurz(r.von):kurz(r.von)+'–'+kurz(r.bis)}</span></button>`).join('');
  const sonst=D.personen.some(p=>p.orte.includes('sonst'))?`<button class="ort-chip" data-ort="sonst" aria-pressed="${S.ort==='sonst'&&!S.q}"><b>Sonstige</b><span>ohne Reiseort</span></button>`:'';
  const el=document.getElementById('orte');el.innerHTML=chips+sonst;
  el.querySelectorAll('.ort-chip').forEach(b=>b.onclick=()=>{S.ort=b.dataset.ort;S.q='';document.getElementById('q').value='';try{localStorage.setItem('kb-ort',JSON.stringify(S.ort))}catch(e){}render();window.scrollTo({top:0})});
  const akt=el.querySelector('[aria-pressed="true"]');if(akt)akt.scrollIntoView({inline:'center',block:'nearest'});
}

function renderTage(){
  const el=document.getElementById('tage');
  if(S.q){el.innerHTML='';return}
  let ab=heute<START?START:heute; if(ab>ENDE){el.innerHTML='';return}
  const vorher=heute<START;
  let h=`<h2 class="h2">${vorher?'Die ersten Reisetage':'Heute und die nächsten Tage'}</h2><div class="tag-liste">`;
  for(let i=0;i<3;i++){
    const t=plus(ab,i); if(t>ENDE)break;
    const orte=ortVonTag(t); const name=[...new Set(orte.map(o=>o.name))].join(' → ')||'unterwegs';
    const ts=D.personen.filter(p=>p.tdat===t&&p.stufe!=='ruht').sort((a,b)=>(a.tzeit||'99').localeCompare(b.tzeit||'99'));
    h+=`<div class="tag${t===heute?' heute':''}"><div class="tag-kopf"><b>${esc(name)}</b><span>${t===heute?'heute · ':''}${fmt(t)}</span></div>`;
    h+=ts.length?`<ul>${ts.map(p=>`<li><span class="zeit">${esc(p.tzeit||'Tag')}</span><span><a href="#p-${p.id}" data-geh="${p.id}">${esc(p.name)}</a> <em>${p.fest?'fest':'vorgeschlagen'}${p.kanal?' · '+esc(p.kanal):''}</em></span></li>`).join('')}</ul>`:`<div class="leer">Kein Termin an diesem Tag.</div>`;
    h+='</div>';
  }
  el.innerHTML=h+'</div>';
  el.querySelectorAll('[data-geh]').forEach(a=>a.onclick=e=>{e.preventDefault();const p=D.personen.find(x=>x.id===a.dataset.geh);S.ort=p.orte.includes(ortId(stopFuer(S.ort)||{id:S.ort}))?S.ort:(D.route.find(r=>p.orte.includes(ortId(r))&&p.tdat>=r.von&&p.tdat<=r.bis)||D.route.find(r=>p.orte.includes(ortId(r)))||{id:'sonst'}).id;render();requestAnimationFrame(()=>{const z=document.getElementById('p-'+p.id);if(z){z.scrollIntoView({block:'start'});window.scrollBy(0,-8)}})});
}

function wegZeile(w,haupt){
  const kopier=['WhatsApp','Mail','Telefon','Messenger','Instagram','Line','Facebook'].includes(w.k);
  const akt=[];
  if(kopier)akt.push(`<button class="mini" data-kopie="${esc(w.v)}">Kopieren</button>`);
  if(w.u)akt.push(`<a class="mini" href="${esc(w.u)}" target="_blank" rel="noopener">Öffnen</a>`);
  return `<div class="weg${haupt?' haupt':''}"><span class="k">${esc(w.k)}${haupt?' ●':''}</span><span class="v">${esc(w.v)}${w.z?`<small>${esc(w.z)}</small>`:''}</span><span class="akt">${akt.join('')}</span></div>`;
}

function person(p,zeigeOrt){
  let h=`<article class="person" id="p-${p.id}"><div class="p-kopf"><div><h3 class="p-name">${esc(p.name)}</h3><span class="p-art">${esc(p.art)}${p.prio?' · Prio '+esc(p.prio):''}${zeigeOrt?' · '+esc(p.orte.map(o=>(D.route.find(r=>ortId(r)===o)||{name:'Sonstige'}).name).join(', ')):''}</span></div><span class="pill s-${p.stufe}">${PILL[p.stufe]}</span></div>`;
  if(p.tdat)h+=`<div class="p-termin">${fmt(p.tdat)}${p.tzeit?' · '+esc(p.tzeit):''} · ${p.fest?'fest zugesagt':'vorgeschlagen'}</div>`;
  else if(p.stufe==='termin')h+=`<div class="p-termin">Zusage ohne festen Tag</div>`;
  if(p.was)h+=`<p class="p-was">${esc(p.was)}</p>`;
  if(p.kanal||p.ich||p.sie){
    h+=`<div class="p-kanal">${p.kanal?`Geschrieben über <b>${esc(p.kanal)}</b>`:'Bisher kein Austausch'}${p.ich?`<span>du ${kurz(p.ich)}</span>`:''}${p.sie?`<span>Antwort ${kurz(p.sie)}</span>`:''}</div>`;
  }
  if(p.wege.length){
    const hauptIdx=p.wege.findIndex(w=>w.k===p.kanal);
    h+=`<div class="wege">${p.wege.map((w,i)=>wegZeile(w,i===hauptIdx)).join('')}</div>`;
  }
  h+=`<div class="p-wo"><div class="ort-text"><i>Wo</i>${esc(p.wo||'unbekannt')}</div>${p.maps?`<a class="maps" href="${esc(p.maps)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" fill="none"/><circle cx="12" cy="9.5" r="2.4" fill="none"/></svg>Google Maps</a>`:''}</div>`;
  if(p.notiz||p.next)h+=`<details class="mehr"><summary>Notiz und nächster Schritt</summary>${p.notiz?`<p>${esc(p.notiz)}</p>`:''}${p.next?`<p><b>Nächster Schritt:</b> ${esc(p.next)}</p>`:''}</details>`;
  return h+'</article>';
}

function sortiere(a,b){
  if(a.stufe==='termin'&&b.stufe==='termin'){const x=(a.tdat||'9')+(a.tzeit||''),y=(b.tdat||'9')+(b.tzeit||'');if(x!==y)return x.localeCompare(y)}
  const pa=(a.prio||'Z'),pb=(b.prio||'Z');if(pa!==pb)return pa.localeCompare(pb);
  return a.name.localeCompare(b.name,'de');
}

function renderOrt(){
  const el=document.getElementById('ort');
  if(S.q){
    const q=S.q.toLowerCase();
    const t=D.personen.filter(p=>[p.name,p.was,p.notiz,p.wo,p.art,...p.wege.map(w=>w.v)].join(' ').toLowerCase().includes(q)).sort(sortiere);
    el.innerHTML=`<div class="ort-kopf"><h1>Suche</h1><div class="dat">${t.length} Treffer für „${esc(S.q)}“</div></div>`+(t.length?t.map(p=>person(p,true)).join(''):'<div class="leer-gruppe">Niemand gefunden. Andere Schreibweise oder nur den Vornamen versuchen.</div>');
    return;
  }
  const stop=stopFuer(S.ort); const oid=stop?ortId(stop):'sonst';
  const leute=D.personen.filter(p=>p.orte.includes(oid));
  const zahl=id=>leute.filter(p=>p.stufe===id).length;
  let h=`<div class="ort-kopf"><h1>${esc(stop?stop.name:'Sonstige')}</h1>`;
  h+=stop?`<div class="dat">${stop.von===stop.bis?fmt(stop.von):fmt(stop.von)+' bis '+fmt(stop.bis)}</div>`:`<div class="dat">Kontakte ohne Reiseort (später, Deutschland)</div>`;
  if(stop&&stop.hin)h+=`<div class="hin">${esc(stop.hin)}</div>`;
  if(stop&&stop.id==='bangkok2')h+=`<div class="hin">Hier stehen alle Bangkok-Kontakte, auch die vom Reisebeginn.</div>`;
  h+=`<div class="zaehler">${STUFEN.map(s=>zahl(s.id)?`<span class="pill s-${s.id}">${zahl(s.id)} ${esc(s.titel)}</span>`:'').join('')}</div></div>`;
  for(const s of STUFEN){
    const g=leute.filter(p=>p.stufe===s.id).sort(sortiere); if(!g.length)continue;
    h+=`<section class="gruppe"><div class="gruppe-kopf"><h2>${esc(s.titel)}</h2><span>${g.length}</span>${s.erkl?`<p>${esc(s.erkl)}</p>`:''}</div>${g.map(p=>person(p,false)).join('')}</section>`;
  }
  const r=leute.filter(p=>p.stufe==='ruht').sort(sortiere);
  if(r.length)h+=`<details class="gruppe ruht-box"><summary><div class="gruppe-kopf"><h2>Ruht gerade</h2><span>${r.length}</span><p>abgeschlossen, später oder nicht jetzt</p></div></summary>${r.map(p=>person(p,false)).join('')}</details>`;
  if(!leute.length)h+='<div class="leer-gruppe">Für diesen Ort ist niemand eingetragen.</div>';
  el.innerHTML=h;
}

function render(){renderOrte();renderTage();renderOrt();
  document.getElementById('fuss').innerHTML=`<div>${D.personen.length} Kontakte. Nicht aufgeführt ist, wer abgesagt hat oder wen du ausgeschlossen hast.</div><div>Stand der Termin-Zentrale vom ${esc(D.stand)}. Neuer Stand: in Claude „Kontaktbuch aktualisieren“ sagen.</div><div><a href="${esc(D.zentrale)}" target="_blank" rel="noopener">Termin-Zentrale öffnen ↗</a></div>${typeof ENC!=='undefined'?'<div><a href="#" onclick="abmelden();return false">Auf diesem Handy abmelden</a></div>':''}`;
}

document.getElementById('q').addEventListener('input',e=>{S.q=e.target.value.trim();renderOrte();renderTage();renderOrt()});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-kopie]'); if(!b)return;
  const txt=b.dataset.kopie;
  try{await navigator.clipboard.writeText(txt)}catch(err){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e2){}t.remove()}
  b.textContent='Kopiert';b.classList.add('ok');setTimeout(()=>{b.textContent='Kopieren';b.classList.remove('ok')},1600);
});
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function entschluesseln(rohKey){
  const key=await crypto.subtle.importKey('raw',rohKey,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function schluesselAus(pw){
  const basis=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(ENC.salt),iterations:ENC.iter},basis,256));
}
async function schloss(){
  document.getElementById('top').hidden=true;
  const box=document.getElementById('schloss');box.hidden=false;
  try{const k=localStorage.getItem('kb-key-'+ENC.salt);if(k){D=await entschluesseln(b64(k));start();return}}catch(e){}
  const form=document.getElementById('schloss-form'),fehler=document.getElementById('schloss-fehler');
  form.onsubmit=async e=>{
    e.preventDefault();fehler.textContent='Wird geöffnet …';
    try{
      const roh=await schluesselAus(document.getElementById('pw').value);
      D=await entschluesseln(roh);
      if(document.getElementById('merken').checked){try{localStorage.setItem('kb-key-'+ENC.salt,btoa(String.fromCharCode(...roh)))}catch(e){}}
      start();
    }catch(err){fehler.textContent='Passwort stimmt nicht. Bitte nochmal versuchen.'}
  };
}
function abmelden(){try{Object.keys(localStorage).filter(k=>k.startsWith('kb-key-')).forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()}
if(D)start();else schloss();
</script>
