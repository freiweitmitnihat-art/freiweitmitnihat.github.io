<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Weiterleitung · Freiweit mit Nihat</title>
<!-- Kurz-URL fuer den QR-Code in den Videos.
Der QR-Code zeigt IMMER hierher und wird nie geaendert, damit bereits
gerenderte Videos gueltig bleiben. Nur das Ziel unten wird angepasst.
Der Parameter via=qr landet als QUELLE im Newsletter-Tool. -->
<meta http-equiv="refresh" content="0; url=/beratung?via=qr">
<link rel="canonical" href="https://freiweitmitnihat.com/beratung">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#1A1410;color:#FAFAF8;font-family:system-ui,-apple-system,sans-serif;
text-align:center;padding:24px;line-height:1.7}
a{color:#C8A97E;font-size:20px}
p{font-size:18px;color:rgba(250,250,248,0.65);margin:0 0 16px}
</style>
</head>
<body>
  <div>
    <p>Einen Moment, es geht weiter zu „Beratungsgespräch".</p>
    <a href="/beratung?via=qr">Hier klicken, falls nichts passiert</a>
  </div>
  <script>window.location.replace('/beratung?via=qr');</script>
</body>
</html>
